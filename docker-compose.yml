services:
  postgres:
    image: postgres:16-alpine
    container_name: paidea-postgres
    restart: always
    environment:
      POSTGRES_USER: paidea_user
      POSTGRES_PASSWORD: paidea_password
      POSTGRES_DB: paidea_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paidea_user -d paidea_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
